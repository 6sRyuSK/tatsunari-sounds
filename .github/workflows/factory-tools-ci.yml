# PR gate for the Python factory tooling (tools/gen_catalog.py, release_plan.py,
# check_skill_refs.py, and their unit tests). Kept separate from the JUCE/CMake
# ci.yml so it never touches that build gate's path scoping. This closes the
# "README catalog drift is ungated" hole: ci.yml only builds when a
# build-affecting source changes, so a plugin.toml/roadmap edit that leaves README
# stale would otherwise merge unchecked. It also gates SKILL DRIFT — a skill that
# names a file/option/test that no longer exists teaches the next agent to build
# the wrong thing, and nothing else in CI reads .claude/. Runs quickly on ubuntu —
# no JUCE, no compilation.
name: factory-tools-ci

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "plugins/*/plugin.toml"
      - "archive/plugins/*/plugin.toml"
      - "roadmap.toml"
      - "README.md"
      - ".claude/skills/**"
      - ".github/workflows/factory-tools-ci.yml"
  # No `paths` on pull_request: the retired-identity gate below reads EVERY
  # tracked file, so scoping this job to tools/** would let an old slug or
  # display name reappear in a workflow, a plugin source or the installer
  # without the gate ever running. The whole job is seconds long on ubuntu.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Gate README catalog staleness (the block between the CATALOG markers must
      # match plugins/*/plugin.toml + roadmap.toml).
      - name: Catalog freshness
        run: python tools/gen_catalog.py --check

      # Gate skill drift: every repo path / FACTORY_* option / rate-swept CTest
      # name a skill cites must still exist, and archived slugs must be marked.
      # Mechanical only — prose accuracy stays a human/agent review job.
      - name: Skill reference freshness
        run: python tools/check_skill_refs.py

      # Gate stable/dev CLAP ID + AU subtype uniqueness (plan §1.6).
      - name: Plugin identity uniqueness
        run: python tools/check_plugin_ids.py --check

      # Gate retired product identity (plan §11.6.7): no old slug / display name
      # / AU subtype / installer filename may survive outside migration material
      # (docs/plans, archive/) or a line marked `legacy-identity-ok`.
      - name: Retired product identity
        run: python tools/check_legacy_identity.py

      # Stdlib-only unit tests for gen_catalog.py, release_plan.py and
      # check_skill_refs.py.
      - name: Unit tests
        run: python -m unittest discover -s tools/tests
